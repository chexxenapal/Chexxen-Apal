<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Java Web Calculator</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; margin-top: 50px; background-color: #f4f4f9; }
        .calc-box { padding: 20px; border-radius: 8px; background: white; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 300px; }
        input, select, button { width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; border-radius: 4px; border: 1px solid #ccc; }
        button { background-color: #007bff; color: white; border: none; font-size: 16px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        #result { margin-top: 15px; font-weight: bold; font-size: 18px; color: #333; }
    </style>
</head>
<body>
    <div class="calc-box">
        <h2>Java Calculator</h2>
        <input type="number" id="num1" placeholder="First Number">
        <select id="operator">
            <option value="add">+</option>
            <option value="subtract">-</option>
            <option value="multiply">*</option>
            <option value="divide">/</option>
        </select>
        <input type="number" id="num2" placeholder="Second Number">
        <button onclick="performCalculation()">Calculate</button>
        <div id="result"></div>
    </div>

    <script>
        async function performCalculation() {
            const num1 = document.getElementById('num1').value;
            const num2 = document.getElementById('num2').value;
            const operator = document.getElementById('operator').value;
            const resultDiv = document.getElementById('result');

            if(!num1 || !num2) {
                resultDiv.innerText = "Please enter both numbers.";
                return;
            }

            try {
                const response = await fetch(`/calculate?num1=${num1}&num2=${num2}&operator=${operator}`);
                const data = await response.json();

                if (data.error) {
                    resultDiv.style.color = "red";
                    resultDiv.innerText = data.error;
                } else {
                    resultDiv.style.color = "#333";
                    resultDiv.innerText = `Result: ${data.result}`;
                }
            } catch (err) {
                resultDiv.innerText = "Error contacting server.";
            }
        }
    </script>
</body>
</html>
